<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoaCard 네이티브 입력 실험</title>
<style>html{color-scheme:light dark}body{font:15px/1.55 system-ui;margin:24px;max-width:64rem;background:Canvas;color:CanvasText}h1{font-size:1.6rem}form{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:.45rem .6rem;max-width:100%}:focus-visible{outline:3px solid Highlight;outline-offset:3px}pre{font:12px/1.5 ui-monospace,monospace;background:color-mix(in srgb,CanvasText 6%,Canvas);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:16px}@media(max-width:420px){body{margin:12px}form{align-items:stretch;flex-direction:column}}</style></head>
<body><h1>네이티브 입력 실험</h1>
<p>등록한 영상을 두 번 순차 디코드해, 같은 YUV 평면에서 같은 RGBA를 만드는지 확인합니다. 일반 스캐너·브라우저 목록·기록 형식은 변경하지 않습니다.</p>
<p>I420/NV12의 명시적인 BT.601·BT.709 제한 범위만 검사합니다. 새 색 변환은 기존 Canvas와 같은 색이라는 보장이 없으며 카드 판독·화면 공유 속도 검증과 별개입니다.</p>
<form><label for="corpus">등록한 영상</label><select id="corpus" disabled></select><button id="run" type="submit" disabled>평면 재현 검사</button><button id="stop" type="button" disabled>중지</button></form>
<p id="status" role="status" aria-live="polite">입력 목록을 읽고 있습니다.</p>
<pre id="summary" aria-label="네이티브 입력 검사 요약"></pre>
<details><summary>전체 검사 근거</summary><pre id="result" aria-label="네이티브 입력 전체 결과"></pre></details>
<script type="module" src="./native-yuv-proof.ts"></script></body></html>
