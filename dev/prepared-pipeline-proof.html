<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoaCard 준비 파이프라인 검증</title>
<style>body{font:15px system-ui;max-width:78rem;margin:2rem;color:#18202a}select,button{font:inherit;padding:.5rem;margin:.4rem}pre{background:#f2f4f7;padding:1rem;white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;max-width:70rem}</style></head>
<body><h1>준비 파이프라인 비교</h1><p id="comparison-description">고정 시작 시각 이상인 첫 원본 표본으로 준비 운동을 한 뒤, 이어지는 30개 원본 프레임을 순차 방식과 한 프레임 선행 준비 방식으로 각각 처리합니다.</p>
<small>실제 준비·획득 Worker와 OPFS 기록을 사용합니다. 전체 래스터·원본·사용 근거·저장 픽셀을 비교하며 OCR은 실행하지 않습니다. 작은 표본의 처리량 검사이고 화면 공유 지연·전체 영상 인식률의 증명은 아닙니다. 기록 예산은 양쪽 모두 기본값입니다. 화면에는 단계와 요약만 표시하며 전체 근거는 JSON으로 저장합니다.</small>
<label>원본 영상 <select id="corpus" aria-label="검증할 영상"></select></label><label>시작 시각(초) <input id="start" type="number" min="0" max="10" step="0.1" value="3" aria-label="고정 검증 시작 시각"></label><button id="run">30프레임 비교</button><button id="stop" disabled>중단</button><button id="save" disabled>검증 결과 저장</button>
<p id="status" role="status">등록한 영상을 불러옵니다.</p><pre id="result" aria-label="준비 파이프라인 검증 요약"></pre><script type="module" src="./prepared-pipeline-proof.ts"></script></body></html>
